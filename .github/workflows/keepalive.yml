name: Render Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            URL="https://twinbytelabs-1.onrender.com"
          fi
          echo "Pinging $URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "OK — service is alive"
          else
            echo "WARNING — service returned $STATUS (may be spinning up)"
          fi
