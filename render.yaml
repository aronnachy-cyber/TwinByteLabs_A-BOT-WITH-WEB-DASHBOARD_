services:
  - type: web
    name: sp4rk
    runtime: python
    rootDir: SENTINEL-BOT-Main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --max-requests 100 --max-requests-jitter 20 wsgi:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: START_BOT_IN_WEB
        value: "true"
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: SERVER_TOKEN
        sync: false
      - key: W_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: ADMIN_DISCORD_ID
        sync: false
      - key: DEV_PIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FORCE_HTTPS_COOKIES
        value: "true"
      - key: SERVER_OFFICIAL_CLIENT_ID
        sync: false
      - key: SERVER_OFFICIAL_PERMISSIONS
        value: "8"
      - key: TESTCORD_TOKEN
        sync: false
      - key: TEST_GUILD_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
