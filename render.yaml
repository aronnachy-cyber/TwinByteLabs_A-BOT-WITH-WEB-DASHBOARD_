services:
  - type: web
    name: sentinel-os-dashboard
    runtime: python
    rootDir: SENTINEL-BOT-Main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 wsgi:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: START_BOT_IN_WEB
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
  - type: worker
    name: sentinel-os-bot
    runtime: python
    rootDir: SENTINEL-BOT-Main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_worker.py
    plan: starter
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
