<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NVD Official — Sign In</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#050b18;
    --bg2:#0a1428;
    --bg3:#0f1d3a;
    --accent:#5b8cff;
    --accent2:#8b5cf6;
    --accent3:#22d3ee;
    --text:#e8efff;
    --muted:#8a9bbf;
    --border:rgba(91,140,255,.18);
    --grad:linear-gradient(135deg,#5b8cff 0%,#8b5cf6 50%,#22d3ee 100%);
    --discord:#5865F2;
    --discord-hover:#4752c4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter','Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }

  /* === Floating gradient orbs (matches NVD Official landing) === */
  .bg-orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .orb{
    position:absolute;border-radius:50%;
    filter:blur(110px);opacity:.5;
  }
  .orb.o1{ width:520px; height:520px; background:#5b8cff; top:-120px; left:-100px; animation:floatA 18s ease-in-out infinite; }
  .orb.o2{ width:480px; height:480px; background:#8b5cf6; top:30%; right:-140px; animation:floatB 22s ease-in-out infinite; }
  .orb.o3{ width:420px; height:420px; background:#22d3ee; bottom:-160px; left:30%; animation:floatC 26s ease-in-out infinite; opacity:.35; }
  @keyframes floatA{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,60px);} }
  @keyframes floatB{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,30px);} }
  @keyframes floatC{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(30px,-50px);} }

  /* === Subtle grid overlay === */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(91,140,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,140,255,0.05) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  /* === Login card === */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    background:rgba(10,20,40,0.75);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:22px;
    padding:44px 36px 36px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.55),
      0 0 0 1px rgba(91,140,255,.04) inset,
      0 1px 0 rgba(255,255,255,.04) inset;
    text-align:center;
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to  { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* === Brand mark (B/L gradient tile, identical to landing nav) === */
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:54px;height:54px;
    border-radius:14px;
    background:var(--grad);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;font-size:1.05rem;letter-spacing:.5px;
    box-shadow:0 10px 30px rgba(91,140,255,.35), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .brand-name{
    font-size:1.6rem;
    font-weight:800;
    letter-spacing:-.5px;
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  h1{
    font-size:1.55rem;
    font-weight:700;
    letter-spacing:-.4px;
    margin-bottom:10px;
    color:var(--text);
  }
  p.lead{
    color:var(--muted);
    font-size:.95rem;
    line-height:1.55;
    margin-bottom:28px;
    max-width:340px;
    margin-left:auto;margin-right:auto;
  }

  /* === Discord button === */
  .btn-discord{
    display:flex;align-items:center;justify-content:center;
    gap:12px;
    width:100%;
    padding:15px 18px;
    background:var(--discord);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:1rem;
    font-weight:600;
    font-family:inherit;
    text-decoration:none;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease, box-shadow .18s ease;
    box-shadow:0 8px 24px rgba(88,101,242,.35);
  }
  .btn-discord:hover{
    background:var(--discord-hover);
    transform:translateY(-1px);
    box-shadow:0 12px 30px rgba(88,101,242,.45);
  }
  .btn-discord i{font-size:1.25rem;}
  .passkey-input{
    width:100%;margin:0 0 12px;padding:15px 16px;border-radius:12px;
    border:1px solid var(--border);background:rgba(5,11,24,.8);
    color:var(--text);font:inherit;outline:none;
  }
  .passkey-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.14);}
  .passkey-submit{font-family:inherit;width:100%;border:0;cursor:pointer;}

  /* === Alert / disabled note === */
  .alert{
    background:rgba(255,80,80,.08);
    border:1px solid rgba(255,80,80,.28);
    color:#ffb3a8;
    padding:13px 14px;
    border-radius:12px;
    font-size:.88rem;
    margin-bottom:18px;
    text-align:left;
    line-height:1.45;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .alert i{color:#ff7a90;flex-shrink:0;margin-top:2px;}

  /* === Tagline pill === */
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;
    background:rgba(91,140,255,.1);
    border:1px solid rgba(91,140,255,.25);
    border-radius:999px;
    font-size:.78rem;
    font-weight:500;
    color:var(--accent);
    margin-bottom:20px;
  }
  .pill .dot{
    width:6px;height:6px;border-radius:50%;background:#22d3ee;
    box-shadow:0 0 10px #22d3ee;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.6;} 50%{opacity:1;} }

  /* === Footer links === */
  .footer{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.05);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .home-link{
    color:var(--muted);
    font-size:.85rem;
    text-decoration:none;
    transition:color .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .home-link:hover{ color:var(--accent); }
  .secured{
    color:var(--muted);
    font-size:.78rem;
    display:inline-flex;align-items:center;gap:6px;
  }
  .secured i{color:#22d3ee;}

  @media (max-width:480px){
    .card{ padding:36px 24px 28px; border-radius:18px; }
    .brand-mark{ width:46px;height:46px;font-size:.95rem; }
    .brand-name{ font-size:1.35rem; }
    h1{ font-size:1.35rem; }
  }
</style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-mark">B/L</div>
      <div class="brand-name">NVD Official</div>
    </div>

    <div class="pill"><span class="dot"></span> Private NVD Official Access</div>

    <h1>Welcome back</h1>
    <p class="lead">Enter your private access key to continue to the NVD Official control center.</p>

    {% if error %}
      <div class="alert"><i class="fas fa-exclamation-circle"></i> <span>{{ error }}</span></div>
    {% endif %}

    <form method="POST" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input class="passkey-input" type="password" name="passkey" placeholder="Enter your NVD Official passkey" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button class="btn-discord passkey-submit" type="submit"><i class="fas fa-lock"></i> Sign in</button>
    </form>

    <div class="footer">
      <a class="home-link" href="/"><i class="fas fa-arrow-left"></i> Back to NVD Official</a>
      <span class="secured"><i class="fas fa-lock"></i> Secured</span>
    </div>
  </div>
{% include "_cookie_consent.html" %}
</body>
</html>
