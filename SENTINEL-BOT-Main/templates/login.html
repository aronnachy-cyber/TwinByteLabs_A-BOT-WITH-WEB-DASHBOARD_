<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SP4RK — Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#07101f;
    --panel:#0f1d38;
    --accent:#3a8fff;
    --accent2:#5ab4ff;
    --text:#e8f0ff;
    --muted:#7a93b8;
    --border:rgba(58,143,255,.25);
    --discord:#5865F2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(ellipse at top,#0d2245 0%,#07101f 70%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:40px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    text-align:center;
  }
  .logo{
    width:64px;height:72px;
    margin:0 auto 18px;
  }
  h1{
    font-size:1.6rem;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:8px;
  }
  p.lead{
    color:var(--muted);
    font-size:0.92rem;
    margin-bottom:28px;
    line-height:1.5;
  }
  .btn-discord{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:14px 18px;
    background:var(--discord);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    transition:opacity .15s,transform .15s;
  }
  .btn-discord:hover{opacity:.9;transform:translateY(-1px);}
  .btn-discord i{font-size:1.3rem;}
  .alert{
    background:rgba(231,76,60,.12);
    border:1px solid rgba(231,76,60,.35);
    color:#ffb3a8;
    padding:12px 14px;
    border-radius:10px;
    font-size:.88rem;
    margin-bottom:18px;
    text-align:left;
  }
  .home-link{
    display:inline-block;
    margin-top:22px;
    color:var(--accent2);
    font-size:0.85rem;
    text-decoration:none;
  }
  .home-link:hover{text-decoration:underline;}
  .disabled-note{
    margin-top:14px;
    font-size:0.8rem;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 40 46" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 3L4 10.5V22C4 32.5 11.5 42.2 20 45C28.5 42.2 36 32.5 36 22V10.5L20 3Z" fill="#0d2245" stroke="#3a8fff" stroke-width="2"/>
      <text x="20" y="31" text-anchor="middle" fill="#3a8fff" font-size="18" font-weight="bold" font-family="Arial,sans-serif">S</text>
    </svg>
    <h1>SP4RK</h1>
    <p class="lead">Sign in with your Discord account to access the dashboard.</p>

    {% if error %}
      <div class="alert"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    {% if discord_configured %}
      <a class="btn-discord" href="/auth/discord">
        <i class="fab fa-discord"></i> Continue with Discord
      </a>
    {% else %}
      <div class="alert">Discord login is not configured. Please contact the administrator.</div>
    {% endif %}

    <a class="home-link" href="/">← Back to Home</a>
  </div>
</body>
</html>
