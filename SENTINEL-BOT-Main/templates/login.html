<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel OS — Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1a1f2e;
  color: #e8ecf0;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-wrap {
  background: #212736;
  border: 1px solid #2e3a4e;
  border-radius: 14px;
  padding: 42px 36px 36px;
  width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.logo-icon {
  width: 44px; height: 44px;
  background: #4f8ef7;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}
.logo-text { font-size: 1.25rem; font-weight: 700; }
.logo-sub { font-size: 0.65rem; color: #4f8ef7; letter-spacing: 2px; text-transform: uppercase; }
h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 20px; color: #8896a7; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 0.8rem; color: #8896a7; margin-bottom: 5px; font-weight: 500; }
input {
  width: 100%; padding: 10px 13px;
  background: #1a1f2e;
  border: 1px solid #2e3a4e;
  color: #e8ecf0;
  border-radius: 8px;
  font-size: 0.9rem;
  font-family: inherit;
  transition: border-color .2s;
}
input:focus { outline: none; border-color: #4f8ef7; }
.captcha-box {
  background: #1a1f2e;
  border: 1px solid #2e3a4e;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.captcha-question {
  font-size: 1.1rem;
  font-weight: 700;
  color: #4f8ef7;
  letter-spacing: 1px;
  min-width: 80px;
}
.captcha-input {
  flex: 1;
  text-align: center;
  max-width: 100px;
  font-size: 1rem;
  font-weight: 700;
}
.btn {
  width: 100%;
  padding: 11px;
  background: #4f8ef7;
  border: none;
  color: white;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s;
}
.btn:hover { background: #3a7ce0; }
.btn:disabled { background: #3a4257; cursor: not-allowed; }
.error {
  background: rgba(231, 76, 60, 0.12);
  border: 1px solid rgba(231, 76, 60, 0.3);
  color: #ff6b6b;
  padding: 10px 13px;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 16px;
}
.divider { border: none; border-top: 1px solid #2e3a4e; margin: 18px 0; }
.hint { font-size: 0.78rem; color: #8896a7; text-align: center; }
.locked-icon { font-size: 2rem; text-align: center; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div>
      <div class="logo-text">Sentinel OS</div>
      <div class="logo-sub">Dashboard Login</div>
    </div>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  {% if locked %}
  <div class="locked-icon">🔒</div>
  <div class="hint" style="margin-bottom:16px;">Access temporarily locked. Please wait before trying again.</div>
  {% else %}
  <h2>Sign in to continue</h2>
  <form method="POST" autocomplete="off">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>
    </div>

    <hr class="divider">

    <div class="field">
      <label>🔒 Security Check — Solve to continue</label>
      <div class="captcha-box">
        <span class="captcha-question">{{ captcha_question }}</span>
        <input class="captcha-input" type="number" name="captcha_answer"
               placeholder="= ?" required min="0" max="99" autocomplete="off">
      </div>
    </div>

    <button class="btn" type="submit">Login →</button>
  </form>

  <hr class="divider">
  <div class="hint">3 failed attempts locks you out for 5 minutes</div>
  {% endif %}
</div>
</body>
</html>
