<style>
  #bl-cookie-banner{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);
    z-index:99999;width:min(640px,calc(100% - 28px));
    background:linear-gradient(135deg,rgba(15,22,38,.96),rgba(8,14,28,.96));
    border:1px solid rgba(120,160,255,.22);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#e8f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:18px 20px;opacity:0;
    transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .35s ease;
    display:none;
  }
  #bl-cookie-banner.bl-show{opacity:1;transform:translateX(-50%) translateY(0)}
  #bl-cookie-banner .bl-cc-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  #bl-cookie-banner .bl-cc-icon{
    flex:0 0 auto;width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,#3a8fff,#7c5cff);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 6px 18px rgba(58,143,255,.35)
  }
  #bl-cookie-banner .bl-cc-text{flex:1 1 280px;min-width:220px;font-size:13.5px;line-height:1.55;color:#cdd9f0}
  #bl-cookie-banner .bl-cc-text strong{color:#fff;display:block;margin-bottom:2px;font-size:14.5px;letter-spacing:.2px}
  #bl-cookie-banner .bl-cc-text a{color:#7cb1ff;text-decoration:none;border-bottom:1px dashed rgba(124,177,255,.45)}
  #bl-cookie-banner .bl-cc-actions{flex:0 0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #bl-cookie-banner button{
    appearance:none;border:0;cursor:pointer;font:600 13px/1 system-ui,sans-serif;
    padding:10px 16px;border-radius:10px;letter-spacing:.2px;transition:transform .15s ease,filter .15s ease,background .15s ease
  }
  #bl-cookie-banner button:hover{transform:translateY(-1px);filter:brightness(1.08)}
  #bl-cookie-banner button:active{transform:scale(.96)}
  #bl-cookie-banner .bl-cc-deny{background:rgba(255,255,255,.06);color:#cdd9f0;border:1px solid rgba(255,255,255,.10)}
  #bl-cookie-banner .bl-cc-deny:hover{background:rgba(255,255,255,.10)}
  #bl-cookie-banner .bl-cc-accept{background:linear-gradient(135deg,#3a8fff,#7c5cff);color:#fff;box-shadow:0 6px 18px rgba(58,143,255,.35)}
  @media (max-width:520px){
    #bl-cookie-banner{bottom:12px;padding:14px 14px}
    #bl-cookie-banner .bl-cc-actions{width:100%;justify-content:flex-end}
  }
</style>

<div id="bl-cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
  <div class="bl-cc-row">
    <div class="bl-cc-icon" aria-hidden="true">🍪</div>
    <div class="bl-cc-text">
      <strong>We use cookies</strong>
      We use essential cookies to keep you signed in and a few optional ones to remember your preferences and understand how the site is used. See our <a href="/privacy">Privacy Policy</a> for details. You can change your choice at any time.
    </div>
    <div class="bl-cc-actions">
      <button type="button" class="bl-cc-deny" id="bl-cc-deny">Deny</button>
      <button type="button" class="bl-cc-accept" id="bl-cc-accept">Accept</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = "bl_cookie_consent";
  var banner = document.getElementById("bl-cookie-banner");
  if (!banner) return;

  /* Read the stored choice — returns "accepted", "denied", or null */
  function getChoice() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return obj && obj.choice ? obj.choice : null;
    } catch(e) { return null; }
  }

  /* Persist choice to both localStorage and a cookie */
  function setChoice(v) {
    try {
      localStorage.setItem(KEY, JSON.stringify({ choice: v, ts: Date.now() }));
    } catch(e) {}
    document.cookie =
      "bl_cookie_consent=" + encodeURIComponent(v) +
      "; Max-Age=" + (60 * 60 * 24 * 365) +
      "; Path=/; SameSite=Lax" +
      (location.protocol === "https:" ? "; Secure" : "");
  }

  /* Slide the banner out, then hide it */
  function hide() {
    banner.classList.remove("bl-show");
    setTimeout(function() {
      banner.style.display = "none";
    }, 460);
  }

  /* Slide the banner in — double rAF ensures the browser paints
     the initial opacity:0 / translateY(160%) state first so the
     CSS transition actually fires */
  function show() {
    banner.style.display = "block";
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        banner.classList.add("bl-show");
      });
    });
  }

  /* Show the banner only if no choice has been made yet */
  if (!getChoice()) {
    setTimeout(show, 700);
  }

  /* Accept button */
  document.getElementById("bl-cc-accept").addEventListener("click", function() {
    setChoice("accepted");
    hide();
    window.dispatchEvent(new CustomEvent("bl:cookie-consent", { detail: { choice: "accepted" } }));
  });

  /* Deny button */
  document.getElementById("bl-cc-deny").addEventListener("click", function() {
    setChoice("denied");
    hide();
    window.dispatchEvent(new CustomEvent("bl:cookie-consent", { detail: { choice: "denied" } }));
  });

  /* Public helpers */
  window.blGetCookieConsent  = function() { return getChoice(); };
  window.blResetCookieConsent = function() {
    try { localStorage.removeItem(KEY); } catch(e) {}
    document.cookie = "bl_cookie_consent=; Max-Age=0; Path=/";
    show();
  };
})();
</script>
