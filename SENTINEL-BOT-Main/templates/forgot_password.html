<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Forgot UID</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --accent:#3a8fff;--text:#e8f0ff;--muted:#7a93b8;
  --border:rgba(58,143,255,0.22);--input-bg:rgba(5,14,35,0.7);
  --card-bg:rgba(8,18,42,0.88);
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#07101f;color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 30% 50%,rgba(0,40,120,0.25) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 40%,rgba(10,50,150,0.2) 0%,transparent 55%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230f2348' stroke-width='0.5'%3E%3Cpath d='M0 30h15m30 0h15M30 0v15m0 30v15'/%3E%3Ccircle cx='30' cy='30' r='2' stroke='%23122850'/%3E%3C/g%3E%3C/svg%3E");
  background-size:auto,auto,60px 60px;
  pointer-events:none;z-index:0;
}
body>*{position:relative;z-index:1;}

.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 36px;
  width:100%;max-width:420px;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 1px rgba(58,143,255,0.07);
}

.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px;}
.logo-text{font-size:1.3rem;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,#fff 40%,#3a8fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:0.7rem;color:var(--muted);letter-spacing:2px;margin-top:2px;}

h2{text-align:center;font-size:1.25rem;font-weight:700;margin-bottom:6px;}
.subtitle{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:24px;line-height:1.5;}

label{display:block;font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
input[type=email]{
  width:100%;background:var(--input-bg);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);font-size:0.95rem;
  outline:none;transition:border-color .2s;
}
input[type=email]:focus{border-color:var(--accent);}

.btn{
  width:100%;background:linear-gradient(135deg,#2a6fd6,#3a8fff);
  color:#fff;border:none;border-radius:10px;padding:13px;
  font-size:1rem;font-weight:700;cursor:pointer;margin-top:18px;
  letter-spacing:0.5px;transition:opacity .2s;
}
.btn:hover{opacity:0.9;}

.alert{
  padding:12px 16px;border-radius:10px;font-size:0.85rem;
  margin-bottom:18px;text-align:center;line-height:1.5;
}
.alert-error{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.3);color:#e74c3c;}
.alert-success{background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);color:#2ecc71;}

.back-link{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--muted);}
.back-link a{color:var(--accent);text-decoration:none;}
.back-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="38" height="38" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 3 L35 10 L35 22 C35 30 28 36 20 38 C12 36 5 30 5 22 L5 10 Z" fill="rgba(58,143,255,0.12)" stroke="#3a8fff" stroke-width="1.5"/>
      <text x="20" y="26" text-anchor="middle" fill="#3a8fff" font-size="16" font-weight="bold" font-family="Arial,sans-serif">S</text>
    </svg>
    <div>
      <div class="logo-text">Sentinel</div>
      <div class="logo-sub">V2.0.4</div>
    </div>
  </div>

  <h2>Forgot Your UID?</h2>
  <p class="subtitle">Enter the email you registered with.<br>We'll send your UID straight to your inbox.</p>

  {% if error %}
  <div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  {% if success %}
  <div class="alert alert-success">
    <i class="fas fa-check-circle"></i> UID sent! Check your inbox (and spam folder).
  </div>
  <div class="back-link"><a href="/login"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
  {% else %}
  <form method="POST" action="/forgot-password">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send My UID</button>
  </form>
  <div class="back-link"><a href="/login"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
  {% endif %}
</div>
</body>
</html>
