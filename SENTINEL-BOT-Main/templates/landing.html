<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP4RK — Discord Bot Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07101f;
  --bg2:#0b1628;
  --accent:#3a8fff;
  --accent2:#5ab4ff;
  --text:#e8f0ff;
  --muted:#7a93b8;
  --border:rgba(58,143,255,0.18);
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== MAINTENANCE OVERLAY ===== */
#maintenance-screen{
  position:fixed;
  inset:0;
  background:rgba(5,10,25,0.97);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.maintenance-card{
  text-align:center;
  padding:50px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(10,22,44,0.9);
  box-shadow:0 0 40px rgba(58,143,255,0.2);
}

/* ===== CRANE ===== */
.construction{
  position:relative;
  width:220px;
  height:180px;
  margin:0 auto 25px;
}
.tower{
  position:absolute;
  bottom:0;
  left:50px;
  width:22px;
  height:130px;
  background:var(--accent);
}
.arm{
  position:absolute;
  top:25px;
  left:70px;
  width:130px;
  height:6px;
  background:var(--accent2);
  transform-origin:left;
  animation:swing 3s infinite ease-in-out;
}
.cable{
  position:absolute;
  top:6px;
  left:100px;
  width:2px;
  height:60px;
  background:#ccc;
  animation:lift 3s infinite ease-in-out;
}
.hook{
  position:absolute;
  top:65px;
  left:95px;
  width:12px;
  height:12px;
  background:#f39c12;
  border-radius:3px;
  animation:lift 3s infinite ease-in-out;
}
.block{
  position:absolute;
  bottom:0;
  left:120px;
  width:45px;
  height:22px;
  background:#2ecc71;
  animation:moveBlock 3s infinite ease-in-out;
}

@keyframes swing{
  0%,100%{transform:rotate(-6deg);}
  50%{transform:rotate(6deg);}
}
@keyframes lift{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-25px);}
}
@keyframes moveBlock{
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(-25px);}
}

/* ===== YOUR ORIGINAL UI (kept) ===== */
nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 48px;
  background:rgba(7,16,31,0.85);
  border-bottom:1px solid var(--border);
}

.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-name{color:var(--text);font-weight:700;}

.btn-getstarted{
  background:var(--accent);
  padding:9px 22px;
  border-radius:8px;
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  padding:80px 48px;
}
.hero h1{
  font-size:2.5rem;
  font-weight:900;
}
.hero span{color:var(--accent);}

/* FEATURES */
.features{
  padding:60px 48px;
}

/* FOOTER */
footer{
  padding:20px 48px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.footer-socials a{
  color:var(--muted);
  margin-right:10px;
}

.footer-copy{
  color:var(--muted);
  font-size:0.8rem;
}
</style>
</head>

<body>

<!-- ===== MAINTENANCE OVERLAY ===== -->
<div id="maintenance-screen">
  <div class="maintenance-card">

    <div class="construction">
      <div class="tower"></div>
      <div class="arm"></div>
      <div class="cable"></div>
      <div class="hook"></div>
      <div class="block"></div>
    </div>

    <h1>SP4RK is under maintenance</h1>
    <p>
      System upgrade in progress.<br>
      Please wait <b>42–72 hours</b>.<br><br>
      yeah… backend crying rn 💀
    </p>

  </div>
</div>

<!-- ===== NAV ===== -->
<nav>
  <a class="nav-logo" href="/">
    <svg width="30" height="34" viewBox="0 0 40 46">
      <path d="M20 3L4 10.5V22C4 32.5 11.5 42.2 20 45C28.5 42.2 36 32.5 36 22V10.5L20 3Z"
        fill="#0d2245" stroke="#3a8fff" stroke-width="1.8"/>
      <text x="20" y="31" text-anchor="middle" fill="#3a8fff" font-size="18" font-weight="bold">S</text>
    </svg>
    <span class="nav-logo-name">SP4RK</span>
  </a>

  <a class="btn-getstarted" href="/login">Get Started</a>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>YOUR SERVER. YOUR KINGDOM.<br>
  <span>SENTINEL CONTROLS EVERYTHING.</span></h1>
</section>

<!-- FEATURES -->
<section class="features">
  <h2>Features still exist… just locked 😭</h2>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-socials">
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-discord"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
    <a href="#"><i class="fab fa-linkedin"></i></a>
  </div>

  <div class="footer-copy">
    &copy; 2024 SP4RK Controls Inc.
  </div>
</footer>

<script>
const MAINTENANCE_MODE = true;

if(!MAINTENANCE_MODE){
  document.getElementById("maintenance-screen").style.display = "none";
}
</script>

</body>
</html>
