<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP4RK — Discord Bot Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07101f;
  --bg2:#0b1628;
  --accent:#3a8fff;
  --accent2:#5ab4ff;
  --text:#e8f0ff;
  --muted:#7a93b8;
  --border:rgba(58,143,255,0.18);
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ===== MAINTENANCE OVERLAY ===== */
#maintenance-screen{
  position:fixed;
  inset:0;
  background:rgba(5,10,25,0.97);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.maintenance-card{
  text-align:center;
  padding:50px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(10,22,44,0.9);
  box-shadow:0 0 40px rgba(58,143,255,0.2);
}

/* ===== CRANE ===== */
.construction{
  position:relative;
  width:280px;
  height:230px;
  margin:0 auto 25px;
}
/* Ground line */
.ground{
  position:absolute;
  left:0;
  right:0;
  bottom:14px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--border) 20%,var(--border) 80%,transparent);
}
/* Concrete base */
.base{
  position:absolute;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:10px;
  background:#5a6473;
  border-radius:2px;
  box-shadow:0 2px 0 rgba(0,0,0,0.25);
}
/* Vertical mast (lattice look via repeating gradient) */
.mast{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:150px;
  background:
    linear-gradient(var(--accent),var(--accent)) center/3px 100% no-repeat,
    repeating-linear-gradient(45deg, var(--accent) 0 2px, transparent 2px 10px),
    repeating-linear-gradient(-45deg, var(--accent) 0 2px, transparent 2px 10px);
  border-left:2px solid var(--accent);
  border-right:2px solid var(--accent);
}
/* Operator cab */
.cab{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  width:22px;
  height:14px;
  background:#f5c542;
  border:1px solid #b8932a;
  border-radius:2px;
  z-index:2;
}
/* Top assembly (jib + counter-jib + trolley + load) — anchored to top of mast */
.top{
  position:absolute;
  top:24px;
  left:50%;
  width:0;
  height:0;
}
/* Main horizontal jib (right side) */
.jib{
  position:absolute;
  top:0;
  left:0;
  width:120px;
  height:8px;
  background:var(--accent2);
  border-top:1px solid rgba(255,255,255,0.25);
  border-bottom:1px solid rgba(0,0,0,0.3);
}
/* Diagonal tie-bars on jib */
.jib::before,
.jib::after{
  content:"";
  position:absolute;
  height:1.5px;
  background:var(--accent2);
  top:-14px;
}
.jib::before{ left:0; width:60px; transform-origin:left; transform:rotate(13deg); }
.jib::after{ left:0; width:120px; transform-origin:left; transform:rotate(6deg); }
/* Counter-jib (left side) with counterweight */
.counter-jib{
  position:absolute;
  top:0;
  right:0;
  left:-45px;
  height:6px;
  background:var(--accent2);
}
.counterweight{
  position:absolute;
  top:-6px;
  left:-52px;
  width:18px;
  height:18px;
  background:#3a4756;
  border:1px solid #1f2730;
  border-radius:2px;
}
/* Trolley travels along the jib (parent of cable + hook + load) */
.trolley{
  position:absolute;
  top:-3px;
  left:90px;
  width:14px;
  height:6px;
  background:#cfd6e0;
  border-radius:2px;
  animation:trolley 6s ease-in-out infinite;
}
/* Cable hangs from the trolley centerline and stretches as the hook lowers */
.cable{
  position:absolute;
  top:6px;
  left:50%;
  width:2px;
  height:60px;
  margin-left:-1px;
  background:#cfd6e0;
  animation:cable 6s ease-in-out infinite;
}
/* Hook sits at the bottom of the cable. Centered under trolley, moves with cable height. */
.hook{
  position:absolute;
  top:66px;
  left:50%;
  width:14px;
  height:10px;
  margin-left:-7px;
  background:#f39c12;
  border-radius:2px;
  box-shadow:0 2px 0 #b87208;
  animation:hook 6s ease-in-out infinite;
}
/* The load — child of hook, so it ALWAYS hangs with the hook */
.block{
  position:absolute;
  top:10px;            /* sits just below the hook */
  left:50%;
  width:28px;
  height:18px;
  margin-left:-14px;
  background:linear-gradient(180deg,#2ecc71,#27ae60);
  border:1px solid #1e8449;
  border-radius:2px;
  box-shadow:0 2px 0 rgba(0,0,0,0.25);
}

/* === KEYFRAMES ===
   Simple, coherent 6s cycle:
   0%   : trolley right, hook fully lowered (load on ground)
   25%  : hook lifts up to jib
   50%  : trolley travels left (load lifted, traveling)
   75%  : hook lowers to ground on left
   100% : returns to start
*/
@keyframes trolley{
  0%,15%   { left:90px; }       /* parked right, lifting */
  35%,65%  { left:25px; }       /* traveling left */
  85%,100% { left:90px; }       /* returning right */
}
@keyframes cable{
  0%,5%    { height:158px; }    /* down on right */
  25%,45%  { height:22px; }     /* lifted (during travel) */
  65%      { height:158px; }    /* down on left */
  80%      { height:22px; }     /* lifted again to return */
  100%     { height:158px; }
}
@keyframes hook{
  0%,5%    { top:164px; }
  25%,45%  { top:28px; }
  65%      { top:164px; }
  80%      { top:28px; }
  100%     { top:164px; }
}

/* ===== YOUR ORIGINAL UI (kept) ===== */
nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 48px;
  background:rgba(7,16,31,0.85);
  border-bottom:1px solid var(--border);
}

.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-name{color:var(--text);font-weight:700;}

.btn-getstarted{
  background:var(--accent);
  padding:9px 22px;
  border-radius:8px;
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  padding:80px 48px;
}
.hero h1{
  font-size:2.5rem;
  font-weight:900;
}
.hero span{color:var(--accent);}

/* FEATURES */
.features{
  padding:60px 48px;
}

/* FOOTER */
footer{
  padding:20px 48px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.footer-socials a{
  color:var(--muted);
  margin-right:10px;
}

.footer-copy{
  color:var(--muted);
  font-size:0.8rem;
}
</style>
</head>

<body>

<!-- ===== MAINTENANCE OVERLAY ===== -->
<div id="maintenance-screen">
  <div class="maintenance-card">

    <div class="construction">
      <div class="ground"></div>
      <div class="base"></div>
      <div class="mast"></div>
      <div class="cab"></div>
      <div class="top">
        <div class="counter-jib"></div>
        <div class="counterweight"></div>
        <div class="jib"></div>
        <div class="trolley">
          <div class="cable"></div>
          <div class="hook">
            <div class="block"></div>
          </div>
        </div>
      </div>
    </div>

    <h1>SP4RK is under maintenance</h1>
    <p>
      System upgrade in progress.<br>
      Please wait <b>42–72 hours</b>.<br><br>
      yeah… backend crying rn 💀
    </p>

  </div>
</div>

<!-- ===== NAV ===== -->
<nav>
  <a class="nav-logo" href="/">
    <svg width="30" height="34" viewBox="0 0 40 46">
      <path d="M20 3L4 10.5V22C4 32.5 11.5 42.2 20 45C28.5 42.2 36 32.5 36 22V10.5L20 3Z"
        fill="#0d2245" stroke="#3a8fff" stroke-width="1.8"/>
      <text x="20" y="31" text-anchor="middle" fill="#3a8fff" font-size="18" font-weight="bold">S</text>
    </svg>
    <span class="nav-logo-name">SP4RK</span>
  </a>

  <a class="btn-getstarted" href="/login">Get Started</a>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>YOUR SERVER. YOUR KINGDOM.<br>
  <span>SENTINEL CONTROLS EVERYTHING.</span></h1>
</section>

<!-- FEATURES -->
<section class="features">
  <h2>Features still exist… just locked 😭</h2>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-socials">
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-discord"></i></a>
    <a href="#"><i class="fab fa-github"></i></a>
    <a href="#"><i class="fab fa-linkedin"></i></a>
  </div>

  <div class="footer-copy">
    &copy; 2024 SP4RK Controls Inc.
  </div>
</footer>

<script>
const MAINTENANCE_MODE = true;

if(!MAINTENANCE_MODE){
  document.getElementById("maintenance-screen").style.display = "none";

</script>

</body>
</html>
