services:
  - type: web
    name: sentinel-os
    runtime: python
    buildCommand: pip install -r SENTINEL-BOT-Main/requirements.txt
    startCommand: cd SENTINEL-BOT-Main && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 wsgi:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENAI_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
