services:
  - type: web
    name: sentinel-os
    runtime: python
    rootDir: SENTINEL-BOT-Main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --max-requests 100 --max-requests-jitter 20 wsgi:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: START_BOT_IN_WEB
        value: "true"
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SP4RK_PASSKEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: SERVER_TOKEN
        sync: false
      - key: W_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
